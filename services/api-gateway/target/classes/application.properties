spring.application.name=api-gateway

server.port=8082

spring.cloud.gateway.server.webmvc.routes[0].id=policy-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8080
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/policies/**

spring.cloud.gateway.server.webmvc.routes[1].id=regulation-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/regulations/**

spring.cloud.gateway.server.webmvc.routes[2].id=compliance-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/compliances/**

spring.cloud.gateway.server.webmvc.routes[3].id=report-service
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/reports/**

spring.cloud.gateway.server.webmvc.routes[4].id=user-service
spring.cloud.gateway.server.webmvc.routes[4].uri=http://localhost:8085
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/users/**
